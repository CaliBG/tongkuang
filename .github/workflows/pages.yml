name: Publish Tongkuang website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build with same-site verified app downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/releases"
          node -e 'for (const u of new Set(Object.values(require("./public/downloads.json")).map(x => x.url))) console.log(u.split("/").slice(-2).join(" "))' > "$RUNNER_TEMP/assets.txt"
          while read -r tag asset; do
            gh release download "$tag" --pattern "$asset" --dir "$RUNNER_TEMP/releases"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/releases/$tag.json"
          done < "$RUNNER_TEMP/assets.txt"
          node scripts/prepare-mirror.mjs "$RUNNER_TEMP/releases" "$RUNNER_TEMP/pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
